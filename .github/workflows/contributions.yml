name: Update contribution heatmap

on:
  schedule:
    - cron: "17 3 * * *" # todo dia às 03:17 UTC (~00:17 em Brasília)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Generate heatmap SVGs
        env:
          GH_USERNAME: rogerio-miguel
          GH_TOKEN: ${{ secrets.CONTRIB_TOKEN }}
        run: node scripts/generate-heatmap.mjs

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/contributions-dark.svg assets/contributions-light.svg
          git diff --cached --quiet || git commit -m "choap"
          git push
